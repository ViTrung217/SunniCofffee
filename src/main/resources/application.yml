spring:
  application:
    name: sunicoffee
  profiles:
    default: local
  flyway:
    clean-disabled: true
  lifecycle:
    timeout-per-shutdown-phase: 30s
  jpa:
    open-in-view: false
    properties:
      # Keep LocalDateTime bindings consistent with JdbcTemplate across JVM time zones.
      hibernate.type.java_time_use_direct_jdbc: true
    hibernate:
      ddl-auto: validate
  thymeleaf:
    encoding: UTF-8
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
server:
  shutdown: graceful
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
app:
  sepay:
    enabled: ${SEPAY_ENABLED:false}
    sandbox: ${SEPAY_SANDBOX:true}
    api-token: ${SEPAY_API_TOKEN:}
    bank-account-id: ${SEPAY_BANK_ACCOUNT_ID:}
    account-number: ${SEPAY_ACCOUNT_NUMBER:}
    qr-account: ${SEPAY_QR_ACCOUNT:}
    bank: ${SEPAY_BANK:}
    holder: ${SEPAY_HOLDER:}
    description-prefix: ${SEPAY_DESCRIPTION_PREFIX:}
    va: ${SEPAY_VA:}
  chat:
    enabled: ${CHAT_AI_ENABLED:false}
    web-search-enabled: ${CHAT_WEB_SEARCH_ENABLED:true}
    gemini-api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.1-flash-lite}
  shipping:
    fee: ${SHIPPING_FEE:0}
    pending-hours: ${PENDING_REMINDER_HOURS:48}
  seed-demo: false
  bootstrap:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
