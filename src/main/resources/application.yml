spring:
  application:
    name: sunicoffee
  profiles:
    default: demo
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  thymeleaf:
    encoding: UTF-8
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
  error:
    include-message: never
    include-stacktrace: never
app:
  chat:
    enabled: ${CHAT_AI_ENABLED:false}
    gemini-api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.1-flash-lite}
  shipping:
    fee: ${SHIPPING_FEE:0}
    pending-hours: ${PENDING_REMINDER_HOURS:48}
  seed-demo: false
  bootstrap:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
