<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Đổi mật khẩu')}"></head><body><header th:replace="~{fragments/layout :: header}"></header><main id="main-content" class="container"><div th:replace="~{fragments/layout :: notices}"></div><a class="back" th:href="@{/account}">← Về hồ sơ</a><section class="auth-card"><h1>Đổi mật khẩu</h1><form th:action="@{/account/password}" th:object="${form}" method="post"><div th:replace="~{fragments/layout :: errors}"></div><label>Mật khẩu hiện tại<input type="password" name="currentPassword" autocomplete="current-password" required></label><label>Mật khẩu mới<input type="password" name="password" autocomplete="new-password" minlength="8" maxlength="64" required></label><label>Nhập lại mật khẩu mới<input type="password" name="confirmPassword" autocomplete="new-password" minlength="8" maxlength="64" required></label><p class="muted">Sau khi đổi mật khẩu, bạn cần đăng nhập lại trên các thiết bị đang sử dụng.</p><button class="full">Đổi mật khẩu</button></form></section></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
