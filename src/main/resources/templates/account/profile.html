<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Hồ sơ của tôi')}"></head><body><header th:replace="~{fragments/layout :: header}"></header><main class="container"><div th:replace="~{fragments/layout :: notices}"></div>
<div class="section-heading"><h1>Hồ sơ của tôi</h1><a th:href="@{/account/password}">Đổi mật khẩu →</a></div>
<form class="panel form-wide" th:action="@{/account/profile}" th:object="${form}" method="post"><div th:replace="~{fragments/layout :: errors}"></div><label>Email đăng nhập<input th:value="${email}" readonly></label><label>Họ và tên<input th:field="*{fullName}" autocomplete="name" maxlength="100" required></label><label>Số điện thoại<input th:field="*{phone}" type="tel" autocomplete="tel" maxlength="20"></label><label>Địa chỉ mặc định<textarea th:field="*{address}" rows="3" autocomplete="street-address" maxlength="500"></textarea></label><p class="muted">Thông tin này được điền sẵn khi bạn đặt hàng. Bạn vẫn có thể chọn người nhận khác.</p><button>Lưu hồ sơ</button></form>
</main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
