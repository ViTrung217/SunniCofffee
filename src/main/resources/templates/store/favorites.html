<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Sản phẩm yêu thích')}"></head><body><header th:replace="~{fragments/layout :: header}"></header><main id="main-content" class="container"><div th:replace="~{fragments/layout :: notices}"></div><p class="eyebrow">GÓC NHỎ CỦA BẠN</p><h1>Sản phẩm yêu thích</h1><p class="muted">Lưu những món bạn thích và quay lại khi sẵn sàng. Sản phẩm ngừng bán sẽ không hiển thị ở đây.</p><div class="empty" th:if="${products.empty}"><h2>Chưa có sản phẩm yêu thích</h2><a class="button" th:href="@{/products}">Khám phá cửa hàng</a></div><div class="product-grid"><article class="product-card" data-reveal th:each="p : ${products.content}"><a class="product-art" th:href="@{/products/{id}(id=${p.id})}"><img th:src="@{${p.imageUrl}}" th:alt="${p.name}" loading="lazy"><span class="stock-tag" th:text="${p.stock>0} ? 'Còn hàng' : 'Tạm hết hàng'"></span></a><div class="product-info"><h3><a th:href="@{/products/{id}(id=${p.id})}" th:text="${p.name}"></a></h3><p th:text="${#numbers.formatDecimal(p.price,0,'POINT',0,'COMMA')} + ' ₫'"></p><form th:action="@{/favorites/{id}/remove(id=${p.id})}" method="post"><button class="link-button">Bỏ yêu thích</button></form></div></article></div><nav class="pagination"><a th:if="${products.hasPrevious()}" th:href="@{/favorites(page=${products.number-1})}">← Trước</a><span th:unless="${products.empty}" th:text="'Trang ' + ${products.number+1}"></span><a th:if="${products.hasNext()}" th:href="@{/favorites(page=${products.number+1})}">Tiếp →</a></nav></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
