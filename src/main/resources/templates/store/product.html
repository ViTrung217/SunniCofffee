<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head th:replace="~{fragments/layout :: head('Chi tiết sản phẩm')}"></head><body><header th:replace="~{fragments/layout :: header}"></header><main id="main-content" class="container"><div th:replace="~{fragments/layout :: notices}"></div>
<a class="back" th:href="@{/products}">← Về cửa hàng</a><section class="detail-grid"><div class="detail-art"><img th:src="@{${product.imageUrl}}" th:alt="${product.name}"></div><div><p class="eyebrow" th:text="${product.category.name}"></p><h1 th:text="${product.name}"></h1><p class="muted" th:text="'SKU: ' + ${product.sku}"></p><p class="large-price" th:text="${#numbers.formatDecimal(product.price,0,'POINT',0,'COMMA')} + ' ₫'"></p><section class="product-description" aria-labelledby="product-description-title"><h2 id="product-description-title">Thông tin sản phẩm</h2><p class="description" th:text="${product.description}"></p></section><p th:text="'Tồn kho: ' + ${product.stock} + ' ' + ${product.salesUnit}"></p>
<form sec:authorize="isAuthenticated()" th:if="${product.stock > 0}" class="buy-form" th:action="@{/cart/add}" method="post"><input type="hidden" name="productId" th:value="${product.id}"><label>Số lượng<input type="number" name="quantity" value="1" min="1" th:max="${T(java.lang.Math).min(99,product.stock)}" required></label><button>Thêm vào giỏ hàng</button></form><a class="button" sec:authorize="isAnonymous()" th:href="@{/login}">Đăng nhập để mua hàng</a><p class="notice" th:if="${product.stock == 0}">Sản phẩm hiện đã hết hàng.</p></div></section>
</main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
