<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Đặt hàng')}"></head><body><header th:replace="~{fragments/layout :: header}"></header><main id="main-content" class="container"><div th:replace="~{fragments/layout :: notices}"></div>
<a class="back" th:href="@{/cart}">← Về giỏ hàng</a><h1>Thông tin nhận hàng</h1><div class="checkout-grid"><form class="panel" th:action="@{/checkout}" th:object="${form}" method="post"><div th:replace="~{fragments/layout :: errors}"></div><input type="hidden" th:field="*{checkoutToken}"><label>Người nhận<input th:field="*{recipientName}" autocomplete="name" required maxlength="100"></label><label>Số điện thoại<input th:field="*{phone}" type="tel" autocomplete="tel" required maxlength="20"></label><label>Địa chỉ nhận hàng<textarea th:field="*{address}" autocomplete="street-address" rows="3" required minlength="10" maxlength="500"></textarea></label><label>Ghi chú<textarea th:field="*{note}" rows="2" maxlength="500"></textarea></label><p class="notice">Thanh toán khi nhận hàng (COD). Phí giao hàng được cộng trong tổng thanh toán.</p><button class="full" th:disabled="${items.empty}">Xác nhận đặt hàng</button></form><aside class="panel"><h2>Đơn hàng của bạn</h2><div class="summary-line" th:each="i : ${items}"><span th:text="${i.product.name} + ' × ' + ${i.quantity}"></span><strong th:text="${#numbers.formatDecimal(i.subtotal,0,'POINT',0,'COMMA')} + ' ₫'"></strong></div><div class="summary-line"><span>Phí vận chuyển</span><span th:text="${#numbers.formatDecimal(shippingFee,0,'POINT',0,'COMMA')} + ' ₫'"></span></div><div class="summary-total"><span>Tổng thanh toán</span><strong th:text="${#numbers.formatDecimal(total,0,'POINT',0,'COMMA')} + ' ₫'"></strong></div></aside></div>
</main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
