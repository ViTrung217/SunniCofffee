<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Thông tin danh mục')}"></head><body><header th:replace="~{fragments/layout :: header}"></header><main id="main-content" class="container"><div th:replace="~{fragments/layout :: notices}"></div><div th:replace="~{fragments/layout :: adminnav}"></div>
<h1 th:text="${id == null} ? 'Thêm danh mục' : 'Chỉnh sửa danh mục'"></h1><form class="panel form-wide" th:action="@{/admin/categories/save}" th:object="${form}" method="post"><div th:replace="~{fragments/layout :: errors}"></div><input type="hidden" name="id" th:value="${id}"><label>Mã danh mục<input th:field="*{code}" pattern="[A-Z0-9_-]{2,30}" required maxlength="30"></label><label>Tên danh mục<input th:field="*{name}" required maxlength="100"></label><label>Mô tả<textarea th:field="*{description}" rows="3" maxlength="1000"></textarea></label><div class="inline"><button>Lưu danh mục</button><a th:href="@{/admin/categories}">Quay lại</a></div></form>
</main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
