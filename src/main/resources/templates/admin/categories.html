<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Quản lý danh mục')}"></head><body><header th:replace="~{fragments/layout :: header}"></header><main id="main-content" class="container"><div th:replace="~{fragments/layout :: notices}"></div><div th:replace="~{fragments/layout :: adminnav}"></div>
<div class="section-heading"><h1>Danh mục sản phẩm</h1><a class="button" th:href="@{/admin/categories/new}">+ Thêm danh mục</a></div><div class="table-wrap"><table><thead><tr><th>Mã</th><th>Tên danh mục</th><th>Mô tả</th><th>Thao tác</th></tr></thead><tbody><tr th:each="c : ${categories}"><td th:text="${c.code}"></td><td th:text="${c.name}"></td><td th:text="${c.description}"></td><td><div class="inline"><a th:href="@{/admin/categories/{id}/edit(id=${c.id})}">Sửa</a><form th:action="@{/admin/categories/{id}/delete(id=${c.id})}" method="post"><button class="link-button danger">Xóa danh mục trống</button></form></div></td></tr></tbody></table></div>
</main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
