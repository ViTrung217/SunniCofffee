<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Tạo tài khoản')}"></head><body><header th:replace="~{fragments/layout :: header}"></header><main class="container"><div th:replace="~{fragments/layout :: adminnav}"></div><h1>Tạo tài khoản</h1><form class="panel form-wide" th:action="@{/admin/users/new}" th:object="${form}" method="post"><div th:replace="~{fragments/layout :: errors}"></div><label>Họ tên<input th:field="*{fullName}" required maxlength="100"></label><label>Email<input th:field="*{email}" type="email" required maxlength="190" autocomplete="off"></label><label>Vai trò<select th:field="*{role}"><option value="CUSTOMER">Khách hàng</option><option value="ADMIN">Quản trị viên</option></select></label><label>Mật khẩu<input type="password" name="password" required minlength="8" maxlength="64" autocomplete="new-password"></label><label>Nhập lại mật khẩu<input type="password" name="confirmPassword" required minlength="8" maxlength="64" autocomplete="new-password"></label><div class="inline"><button>Tạo tài khoản</button><a th:href="@{/admin/users}">Quay lại</a></div></form></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
