<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Quản lý sản phẩm')}"></head><body><header th:replace="~{fragments/layout :: header}"></header><main id="main-content" class="container"><div th:replace="~{fragments/layout :: notices}"></div><div th:replace="~{fragments/layout :: adminnav}"></div>
<div class="section-heading"><h1>Quản lý sản phẩm</h1><a class="button" th:href="@{/admin/products/new}">+ Thêm sản phẩm</a></div><form class="filters" th:action="@{/admin/products}" method="get"><label class="grow">Tìm theo tên hoặc SKU<input name="q" th:value="${q}" maxlength="100"></label><button>Tìm kiếm</button></form><div class="table-wrap"><table><thead><tr><th>SKU / Tên</th><th>Danh mục</th><th>Giá bán</th><th>Tồn kho</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody><tr th:each="p : ${products.content}"><td><small th:text="${p.sku}"></small><strong th:text="${p.name}"></strong></td><td th:text="${p.category.name}"></td><td th:text="${#numbers.formatDecimal(p.price,0,'POINT',0,'COMMA')} + ' ₫'"></td><td th:text="${p.stock}"></td><td th:text="${p.active} ? 'Đang bán' : 'Ngừng bán'"></td><td><div class="inline"><a th:href="@{/admin/products/{id}/edit(id=${p.id})}">Sửa</a><form th:if="${p.active}" th:action="@{/admin/products/{id}/archive(id=${p.id})}" method="post"><button class="link-button danger">Ngừng bán</button></form></div></td></tr></tbody></table><p th:if="${products.empty}">Chưa có sản phẩm phù hợp.</p></div><div class="pagination" th:if="${products.totalPages > 1}"><a th:if="${products.hasPrevious()}" th:href="@{/admin/products(q=${q},page=${products.number - 1})}">← Trang trước</a><span th:text="'Trang ' + ${products.number + 1}"></span><a th:if="${products.hasNext()}" th:href="@{/admin/products(q=${q},page=${products.number + 1})}">Trang sau →</a></div>
</main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
