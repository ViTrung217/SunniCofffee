<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Chỉnh sửa tài khoản')}"></head><body><header th:replace="~{fragments/layout :: header}"></header><main id="main-content" class="container"><div th:replace="~{fragments/layout :: adminnav}"></div><h1>Chỉnh sửa tài khoản</h1><form class="panel form-wide" th:action="@{/admin/users/{id}/edit(id=${account.id})}" th:object="${form}" method="post"><div th:replace="~{fragments/layout :: errors}"></div><input th:field="*{version}" type="hidden"><label>Email đăng nhập<input th:value="${account.email}" readonly></label><label>Họ tên<input th:field="*{fullName}" required maxlength="100"></label><label>Vai trò<select th:field="*{role}"><option value="CUSTOMER">Khách hàng</option><option value="ADMIN">Quản trị viên</option></select></label><label class="check"><input th:field="*{enabled}" type="checkbox"> Tài khoản đang hoạt động</label><p class="muted">Khóa tài khoản hoặc thay đổi quyền sẽ làm hết hiệu lực các phiên đăng nhập hiện tại. Lịch sử đơn hàng được giữ lại.</p><div class="inline"><button>Lưu thay đổi</button><a th:href="@{/admin/users}">Quay lại</a></div></form></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
