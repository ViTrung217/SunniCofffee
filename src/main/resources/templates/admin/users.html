<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Quản trị tài khoản')}"></head><body><header th:replace="~{fragments/layout :: header}"></header><main id="main-content" class="container"><div th:replace="~{fragments/layout :: notices}"></div><div th:replace="~{fragments/layout :: adminnav}"></div><div class="section-heading"><h1>Quản trị tài khoản</h1><a class="button" th:href="@{/admin/users/new}">+ Tạo tài khoản</a></div><form class="filters" th:action="@{/admin/users}" method="get"><label class="grow">Tên hoặc email<input name="q" th:value="${q}" maxlength="100"></label><button>Tìm kiếm</button></form><div class="table-wrap"><table><thead><tr><th>Họ tên</th><th>Email</th><th>Vai trò</th><th>Trạng thái</th><th></th></tr></thead><tbody><tr th:each="u : ${users.content}"><td th:text="${u.fullName}"></td><td th:text="${u.email}"></td><td th:text="${u.role.name() == 'ADMIN'} ? 'Quản trị viên' : 'Khách hàng'"></td><td th:text="${u.enabled} ? 'Đang hoạt động' : 'Đã khóa'"></td><td><a th:href="@{/admin/users/{id}/edit(id=${u.id})}">Chỉnh sửa</a></td></tr></tbody></table><p th:if="${users.empty}" class="notice">Không tìm thấy tài khoản.</p></div><div class="pagination" th:if="${users.totalPages > 1}"><a th:if="${users.hasPrevious()}" th:href="@{/admin/users(q=${q},page=${users.number - 1})}">← Trang trước</a><span th:text="'Trang ' + ${users.number + 1}"></span><a th:if="${users.hasNext()}" th:href="@{/admin/users(q=${q},page=${users.number + 1})}">Trang sau →</a></div></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
