<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Nhập xuất kho')}"></head><body><header th:replace="~{fragments/layout :: header}"></header><main id="main-content" class="container"><div th:replace="~{fragments/layout :: notices}"></div><div th:replace="~{fragments/layout :: adminnav}"></div><h1>Nhập/xuất kho</h1><p class="muted">Mỗi phiếu ghi nhận một mặt hàng. Đơn mua và hủy đơn tự cập nhật lịch sử kho.</p>
<form class="panel form-wide" th:action="@{/admin/inventory}" th:object="${form}" method="post"><div th:replace="~{fragments/layout :: errors}"></div><input type="hidden" th:field="*{requestToken}"><label>Sản phẩm và tồn hiện tại<select th:field="*{productId}" required><option value="">Chọn sản phẩm</option><option th:each="p : ${products}" th:value="${p.id}" th:text="${p.sku} + ' · ' + ${p.name} + ' · Tồn: ' + ${p.stock}"></option></select></label><div class="form-grid"><label>Loại phiếu<select th:field="*{type}"><option value="RECEIPT">Nhập kho</option><option value="ISSUE">Xuất kho khác (hỏng, hao hụt…)</option></select></label><label>Số lượng<input type="number" th:field="*{quantity}" min="1" max="1000000" required></label></div><label>Lý do hoặc thông tin phiếu<textarea th:field="*{reason}" rows="2" maxlength="500" required placeholder="Ví dụ: nhập bổ sung lô hàng tháng 10"></textarea></label><button>Ghi phiếu và cập nhật tồn</button></form>
<div class="section-heading"><h2>Lịch sử biến động kho</h2></div><form class="filters" th:action="@{/admin/inventory}" method="get"><label class="grow">Lọc sản phẩm<select name="productId"><option value="">Tất cả sản phẩm</option><option th:each="p : ${products}" th:value="${p.id}" th:selected="${p.id == selectedProduct}" th:text="${p.sku} + ' · ' + ${p.name}"></option></select></label><button>Lọc lịch sử</button></form>
<div class="table-wrap"><table><thead><tr><th>Ngày / Mã phiếu</th><th>Sản phẩm</th><th>Loại</th><th>Thay đổi</th><th>Tồn sau</th><th>Người thực hiện</th><th>Lý do</th></tr></thead><tbody><tr th:each="v : ${movements.content}"><td><span th:text="${#temporals.format(v.createdAt,'dd/MM/yyyy HH:mm')}"></span><small th:text="'KHO-' + ${v.id}"></small></td><td th:text="${v.product.sku}"></td><td th:text="${v.type.label}"></td><td th:text="${v.quantityDelta > 0} ? '+' + ${v.quantityDelta} : ${v.quantityDelta}"></td><td th:text="${v.balanceAfter}"></td><td th:text="${v.actor == null} ? 'Hệ thống' : ${v.actor.fullName}"></td><td th:text="${v.reason}"></td></tr></tbody></table><p class="notice" th:if="${movements.empty}">Chưa có biến động kho.</p></div><div class="pagination" th:if="${movements.totalPages > 1}"><a th:if="${movements.hasPrevious()}" th:href="@{/admin/inventory(productId=${selectedProduct},page=${movements.number - 1})}">← Trang trước</a><span th:text="'Trang ' + ${movements.number + 1}"></span><a th:if="${movements.hasNext()}" th:href="@{/admin/inventory(productId=${selectedProduct},page=${movements.number + 1})}">Trang sau →</a></div></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
