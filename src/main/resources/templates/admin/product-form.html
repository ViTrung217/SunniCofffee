<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Thông tin sản phẩm')}"></head><body><header th:replace="~{fragments/layout :: header}"></header><main class="container"><div th:replace="~{fragments/layout :: notices}"></div><div th:replace="~{fragments/layout :: adminnav}"></div>
<h1 th:text="${id == null} ? 'Thêm sản phẩm' : 'Chỉnh sửa sản phẩm'"></h1><form class="panel form-wide" th:action="@{/admin/products/save}" method="post" th:object="${form}"><div th:replace="~{fragments/layout :: errors}"></div><input type="hidden" name="id" th:value="${id}"><input type="hidden" th:field="*{version}"><div class="form-grid"><label>Mã SKU<input th:field="*{sku}" required maxlength="50" pattern="[A-Z0-9_-]{2,50}"><small>Chữ in hoa, số và dấu gạch. Mỗi quy cách bán có một SKU.</small></label><label>Tên sản phẩm<input th:field="*{name}" required maxlength="160"></label><label>Danh mục<select th:field="*{categoryId}" required><option value="">Chọn danh mục</option><option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"></option></select></label><label>Đơn vị bán<input th:field="*{salesUnit}" required maxlength="30" placeholder="túi, chiếc, bộ..."></label><label>Giá bán (VND)<input th:field="*{price}" type="number" required min="1" max="999999999999" step="1"></label><label>Tồn kho hiện tại<input th:field="*{stock}" type="number" required min="0" max="2147483647" th:readonly="${id != null}"><small th:if="${id != null}">Thay đổi số lượng qua mục Nhập/xuất kho.</small></label></div><label>Mô tả<textarea th:field="*{description}" rows="4" required maxlength="2000"></textarea></label><label class="check"><input type="checkbox" th:field="*{active}"> Đang mở bán</label><div class="inline"><button>Lưu sản phẩm</button><a th:href="@{/admin/products}">Quay lại</a></div></form>
<section class="panel form-wide image-editor" th:if="${id != null}"><h2>Ảnh sản phẩm</h2><img class="image-preview" th:src="@{${product.imageUrl}}" th:alt="${product.name}"><p class="muted">Ảnh JPG/PNG tối đa 5 MB, mỗi chiều tối đa 4096 px.</p><form th:action="@{/admin/products/{id}/image(id=${id},_csrf=${_csrf.token})}" method="post" enctype="multipart/form-data"><label>Chọn ảnh<input type="file" name="image" accept="image/jpeg,image/png" required></label><button>Tải hoặc thay ảnh</button></form><form th:if="${product.hasImage}" th:action="@{/admin/products/{id}/image/remove(id=${id})}" method="post"><button class="link-button danger">Gỡ ảnh hiện tại</button></form></section><p class="notice" th:if="${id == null}">Lưu sản phẩm trước, sau đó tải ảnh tại trang chỉnh sửa.</p></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
