<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Đăng ký')}"></head><body><header th:replace="~{fragments/layout :: header}"></header><main id="main-content" class="container"><div th:replace="~{fragments/layout :: notices}"></div>
<section class="auth-card"><p class="eyebrow">BẮT ĐẦU CÙNG SUNICOFFEE</p><h1>Tạo tài khoản</h1><form th:action="@{/register}" th:object="${form}" method="post"><div th:replace="~{fragments/layout :: errors}"></div><label>Họ và tên<input th:field="*{fullName}" autocomplete="name" required maxlength="100"></label><label>Email<input th:field="*{email}" type="email" autocomplete="username" required maxlength="190"></label><label>Mật khẩu<input type="password" name="password" autocomplete="new-password" required minlength="8" maxlength="64"><small>Ít nhất 8 ký tự.</small></label><label>Nhập lại mật khẩu<input type="password" name="confirmPassword" autocomplete="new-password" required minlength="8" maxlength="64"></label><button class="full">Tạo tài khoản</button></form><p>Đã có tài khoản? <a th:href="@{/login}">Đăng nhập</a></p></section>
</main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
