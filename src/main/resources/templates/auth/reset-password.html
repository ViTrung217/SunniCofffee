<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Đặt lại mật khẩu')}"></head><body class="auth-page"><header th:replace="~{fragments/layout :: header}"></header><main id="main-content" class="container"><section class="auth-card" data-reveal><span class="auth-emblem" aria-hidden="true">S.</span><p class="eyebrow">TÀI KHOẢN SUNICOFFEE</p><h1>Đặt lại mật khẩu</h1><p class="muted">Liên kết có hiệu lực 15 phút và chỉ dùng được một lần.</p><p class="notice error" th:if="${error}" th:text="${error}"></p>
<p class="notice" th:unless="${resetAvailable}">Khôi phục qua email hiện chưa khả dụng. Vui lòng thử lại sau.</p>
<form th:if="${resetAvailable}" th:action="@{/reset-password}" method="post"><input type="hidden" name="token" th:value="${token}"><label>Mật khẩu mới<input type="password" name="password" autocomplete="new-password" minlength="8" maxlength="64" required></label><label>Nhập lại mật khẩu<input type="password" name="confirmPassword" autocomplete="new-password" minlength="8" maxlength="64" required></label><button class="full">Lưu mật khẩu mới</button></form><p><a th:href="@{/forgot-password}">Yêu cầu liên kết mới</a></p><p><a th:href="@{/login}">← Quay lại đăng nhập</a></p></section></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
