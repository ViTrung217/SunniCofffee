<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Đơn hàng')}"></head><body><header th:replace="~{fragments/layout :: header}"></header><main class="container"><div th:replace="~{fragments/layout :: notices}"></div>
<div th:if="${admin}"><div th:replace="~{fragments/layout :: adminnav}"></div></div><h1 th:text="${admin} ? 'Quản lý đơn hàng' : 'Đơn hàng của tôi'"></h1><form th:if="${admin}" class="filters order-filters" th:action="@{/admin/orders}" method="get">
<label>Mã đơn / người nhận / email<input name="q" th:value="${q}" maxlength="100"></label>
<label>Trạng thái<select name="status"><option value="">Tất cả</option><option th:each="s : ${statuses}" th:value="${s}" th:text="${s.label}" th:selected="${s == selectedStatus}"></option></select></label>
<label>Từ ngày<input type="date" name="from" th:value="${from}"></label><label>Đến ngày<input type="date" name="to" th:value="${to}"></label>
<label class="check"><input type="checkbox" name="overdue" value="true" th:checked="${overdue}"><span th:text="'Chờ xác nhận quá ' + ${pendingHours} + ' giờ'"></span></label><button>Lọc đơn</button><a th:href="@{/admin/orders}">Xóa bộ lọc</a>
</form><p th:if="${admin}" class="muted">Đơn chờ lâu cần được liên hệ xác nhận hoặc hủy có lý do; hệ thống không tự hủy đơn COD.</p><div class="empty" th:if="${orders.empty}"><h2>Chưa có đơn hàng</h2><a th:href="@{/products}">Về cửa hàng</a></div><div class="table-wrap" th:unless="${orders.empty}"><table><thead><tr><th>Mã đơn</th><th>Ngày đặt</th><th>Người nhận</th><th>Tổng tiền</th><th>Trạng thái</th><th></th></tr></thead><tbody><tr th:each="o : ${orders.content}"><td th:text="'SUNI-' + ${o.id}"></td><td th:text="${#temporals.format(o.createdAt,'dd/MM/yyyy HH:mm')}"></td><td th:text="${o.recipientName}"></td><td th:text="${#numbers.formatDecimal(o.total,0,'POINT',0,'COMMA')} + ' ₫'"></td><td><span class="badge" th:text="${o.status.label}"></span></td><td><a th:href="${admin} ? @{/admin/orders/{id}(id=${o.id})} : @{/orders/{id}(id=${o.id})}">Chi tiết →</a></td></tr></tbody></table></div><div class="pagination" th:if="${orders.totalPages > 1}"><a th:if="${orders.hasPrevious()}" th:href="${admin} ? @{/admin/orders(page=${orders.number - 1},q=${q},status=${selectedStatus},from=${from},to=${to},overdue=${overdue})} : @{/orders(page=${orders.number - 1})}">← Trang trước</a><span th:text="'Trang ' + ${orders.number + 1}"></span><a th:if="${orders.hasNext()}" th:href="${admin} ? @{/admin/orders(page=${orders.number + 1},q=${q},status=${selectedStatus},from=${from},to=${to},overdue=${overdue})} : @{/orders(page=${orders.number + 1})}">Trang sau →</a></div>
</main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
