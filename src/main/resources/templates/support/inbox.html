<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Chat khách hàng')}"></head>
<body><header th:replace="~{fragments/layout :: header}"></header><main id="main-content" class="container">
<nav th:replace="~{fragments/layout :: adminnav}"></nav><h1>Chat khách hàng</h1><p class="muted">Hộp thư chung của quản trị. Mở một hội thoại để đọc và trả lời; tin chưa đọc được tính chung cho đội ngũ quản trị.</p>
<form class="filters" th:action="@{/admin/support}" method="get"><label class="grow">Tên hoặc email<input name="q" maxlength="100" th:value="${q}" placeholder="Tìm khách hàng"></label><label>Trạng thái<select name="state"><option value="all" th:selected="${state == 'all'}">Tất cả</option><option value="unread" th:selected="${state == 'unread'}">Chưa đọc</option><option value="open" th:selected="${state == 'open'}">Đang mở</option><option value="closed" th:selected="${state == 'closed'}">Đã đóng</option></select></label><button>Lọc hội thoại</button></form>
<p id="inbox-status" role="status" class="muted">Hộp thư tự cập nhật khi trang đang mở.</p>
<div id="support-inbox" class="table-wrap" th:attr="data-endpoint=@{/admin/support/threads},data-base=@{/admin/support/},data-query=${q},data-state=${state},data-page=${page}"><table><thead><tr><th>Khách hàng</th><th>Tin gần nhất</th><th>Chưa đọc</th><th>Trạng thái</th><th>Cập nhật</th></tr></thead><tbody id="support-threads"><tr th:each="c : ${inbox.conversations}"><td><a th:href="@{/admin/support/{id}(id=${c.id})}" th:text="${c.customerName}"></a><br><small th:text="${c.customerEmail}"></small></td><td th:text="${c.preview}"></td><td th:text="${c.unread}"></td><td th:text="${c.closed} ? 'Đã đóng' : 'Đang mở'"></td><td th:text="${#temporals.format(c.updatedAt,'dd/MM HH:mm')}"></td></tr><tr th:if="${inbox.conversations.empty}"><td colspan="5">Chưa có hội thoại phù hợp.</td></tr></tbody></table></div>
<div class="pagination"><a th:if="${page > 0}" th:href="@{/admin/support(q=${q},state=${state},page=${page - 1})}">← Trang trước</a><span th:text="'Trang ' + ${page + 1}"></span><a id="inbox-next" th:href="@{/admin/support(q=${q},state=${state},page=${page + 1})}" th:hidden="${!inbox.hasMore}">Trang sau →</a></div>
</main><footer th:replace="~{fragments/layout :: footer}"></footer><script defer th:src="@{/js/support-inbox.js}"></script></body></html>
