name: Verify
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-only-password
          MYSQL_DATABASE: sunicoffee_ci_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ptest-only-password"
          --health-interval=10s --health-timeout=5s --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -Ddebug=false verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h2-tests
          path: target/surefire-reports
      - run: mvn -B -Ddebug=false -Dspring.datasource.url='jdbc:mysql://127.0.0.1:3306/sunicoffee_ci_test?connectionTimeZone=Asia/Ho_Chi_Minh' -Dspring.datasource.username=root test
        env:
          SPRING_DATASOURCE_PASSWORD: test-only-password
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mysql-tests
          path: target/surefire-reports
