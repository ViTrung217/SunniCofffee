name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        database: [h2, mysql]
    env:
      TZ: UTC
    services:
      mysql:
        image: mysql:8.4@sha256:a0225d1ea6631c8bc2385dc4c2faba17bbf1834ecf369e1659a9a382bd8d5dd7
        env:
          MYSQL_ROOT_PASSWORD: test-only-password
          MYSQL_DATABASE: sunicoffee_ci_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ptest-only-password"
          --health-interval=10s --health-timeout=5s --health-retries=15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify frozen chatbot baseline
        run: python3 scripts/verify-chatbot-baseline.py
      - name: Verify local SePay configuration helper
        run: python3 scripts/test-configure-sepay.py
      - name: Verify Google configuration helper
        run: python3 scripts/test-configure-google.py
      - name: Verify payment page lifecycle
        run: node scripts/test-payment-lifecycle.mjs
      - name: Verify storefront motion lifecycle
        run: node scripts/test-storefront-lifecycle.mjs
      - name: Verify H2
        id: h2
        if: matrix.database == 'h2'
        run: mvn -B -Ddebug=false verify
      - name: Verify MySQL
        id: mysql
        if: matrix.database == 'mysql'
        run: mvn -B -Ddebug=false -Dspring.datasource.url='jdbc:mysql://127.0.0.1:3306/sunicoffee_ci_test?connectionTimeZone=Asia/Ho_Chi_Minh&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8&sslMode=DISABLED&allowPublicKeyRetrieval=true' -Dspring.datasource.username=root verify
        env:
          SPRING_DATASOURCE_PASSWORD: test-only-password
      - name: Annotate test failures
        if: failure()
        run: |
          python3 - <<'PYTHON'
          import pathlib, xml.etree.ElementTree as ET
          def escape(value):
              return value.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          for report in pathlib.Path('target/surefire-reports').glob('TEST-*.xml'):
              for case in ET.parse(report).getroot().iter('testcase'):
                  for tag in ('failure', 'error'):
                      for problem in case.findall(tag):
                          title = case.get('classname', '') + '.' + case.get('name', '')
                          message = problem.get('message') or (problem.text or 'Test failed')
                          print('::error::' + escape(title + ': ' + message[:3000]))
          PYTHON
      - uses: actions/upload-artifact@v6
        if: always() && (steps.h2.outcome == 'success' || steps.h2.outcome == 'failure' || steps.mysql.outcome == 'success' || steps.mysql.outcome == 'failure')
        with:
          name: ${{ matrix.database }}-tests
          path: target/surefire-reports
          if-no-files-found: warn
